<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OneSemester — one term at a time</title>
<meta name="description" content="A focus-first planner that helps you finish one semester before you worry about the next." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="app">

  <header class="app-header">
    <button id="nav-toggle" class="icon-btn only-mobile" data-action="toggle-nav" aria-label="Toggle navigation" aria-expanded="false">☰</button>
    <div class="brand">
      <span class="brand-mark">🎯</span>
      <span class="brand-name">OneSemester</span>
    </div>
    <nav id="main-nav" class="main-nav">
      <button class="nav-link" data-action="go-view" data-view="dashboard">Dashboard</button>
      <button class="nav-link" data-action="go-view" data-view="workspace">Current Semester</button>
      <button class="nav-link" data-action="go-view" data-view="semesters">All Semesters</button>
      <button class="nav-link" data-action="go-view" data-view="settings">Settings</button>
    </nav>
    <div class="header-actions">
      <button id="theme-toggle" class="icon-btn" data-action="cycle-theme" title="Change theme" aria-label="Change theme">🌗</button>
    </div>
  </header>

  <main id="app-main" class="app-main" aria-live="polite">
    <!-- rendered by app.js -->
  </main>

  <footer class="app-footer">
    <span>Your data stays on this device — nothing is uploaded anywhere.</span>
  </footer>

</div>

<div id="modal-root" class="modal-root" hidden></div>
<div id="toast-root" class="toast-root" aria-live="assertive"></div>

<script src="app.js"></script>
</body>
</html>
